# Host edge Nginx for QueryForge demo.
# Fake domain: queryforge.local  (map via /etc/hosts to the server public IP)
#
# Topology:
#   browser → host nginx :443 → docker web :8080 → FastAPI :8000

upstream queryforge_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name queryforge.local 106.12.4.23;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "host-nginx-ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name queryforge.local 106.12.4.23;

    ssl_certificate     /etc/nginx/ssl/queryforge.local.crt;
    ssl_certificate_key /etc/nginx/ssl/queryforge.local.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Real client IP / proto for the app behind Docker Nginx.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # SSE / long Text-to-SQL streams
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
    add_header X-Accel-Buffering "no" always;

    location = /healthz {
        access_log off;
        proxy_pass http://queryforge_web;
    }

    location / {
        proxy_pass http://queryforge_web;
    }
}
